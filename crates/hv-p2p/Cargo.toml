[package]
name = "hv-p2p"
description = "A tunnel to a HataVoice server that has no public address: iroh dials by key, punches through NATs, falls back to a relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
if-addrs = "0.15.0"
iroh = "1.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
