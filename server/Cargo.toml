[package]
name = "hatavoice-server"
description = "HataVoice voice server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hatavoice_server"

[[bin]]
name = "hatavoice-server"
path = "src/main.rs"

[features]
# Test doubles (a fake LiveKit) for tests of this crate and of crates that run a server in-process.
testing = []

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
hv-host = { path = "../crates/hv-host" }
hv-roster = { path = "../crates/hv-roster" }
hv-tls = { path = "../crates/hv-tls" }
hv-p2p = { path = "../crates/hv-p2p" }
getrandom = "0.4.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
if-addrs = "0.15.0"
igd-next = { version = "0.18.0", features = ["aio_tokio"] }
livekit-api = { version = "0.9.1", default-features = false, features = ["access-token"] }
# "rustls" brings a crypto provider. The server only talks plain http to its own LiveKit, but iroh turns on reqwest's
# provider-less TLS, and then every Client::build() panics. Built together with the client or for tests, cargo unifies
# the features and hides it: only `cargo build -p hatavoice-server`, the way the installer does it, shows the crash.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time"] }
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
hatavoice-server = { path = ".", features = ["testing"] }
http-body-util = "0.1.5"
hv-host = { path = "../crates/hv-host" }
livekit-api = { version = "0.9.1", default-features = false, features = ["access-token"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
